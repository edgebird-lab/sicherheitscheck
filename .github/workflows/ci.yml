name: Prüfung

# Lint, Unit-Tests und Build bei jedem Push, dazu die Netztests der Crate netzpruefung
# (ohne Tauri, deshalb unter Linux). Die Browsertests (Playwright mit axe) laufen lokal vor
# jedem Commit mit Edge; so bleibt der Lauf kurz.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Netztests (cargo test -p netzpruefung)
        run: cargo test --manifest-path src-tauri/Cargo.toml -p netzpruefung
