name: Windows-Programm

# Windows-Läufe kosten im privaten Repo mehr Minuten. Deshalb nur, wenn sich der
# Programmteil ändert, oder von Hand.
on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'src/plattform/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

jobs:
  bauen:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Rust-Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace
      - name: Kein aws-lc (Kryptoanbieter ist ring)
        shell: pwsh
        run: |
          $treffer = cargo tree --manifest-path src-tauri/Cargo.toml --workspace -i aws-lc-sys 2>&1
          if ($LASTEXITCODE -eq 0) { throw "aws-lc-sys ist eingebunden: $treffer" }
      - name: Programm und Installer bauen
        run: npx tauri build
      - name: Installer prüfen (still installieren, Verknüpfungen und Zuordnung prüfen, deinstallieren)
        shell: pwsh
        run: ./src-tauri/windows/installer-test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: sicherheitscheck-windows
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          retention-days: 14
