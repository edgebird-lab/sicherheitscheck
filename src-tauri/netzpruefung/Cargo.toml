[package]
name = "netzpruefung"
version = "0.1.0"
description = "Netzzugriffe der Außenprüfung ohne Tauri: Freigabe, Zielprüfung mit Adresssperre, DNS über HTTPS, HTTP ohne Weiterleitung, TLS-Angaben"
authors = ["Robin Olbricht"]
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
psl = "2.1.250"
# Kryptoanbieter ring statt aws-lc-rs, damit keine zusätzlichen Build-Werkzeuge nötig sind (7.2)
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1.0.12"
x509-parser = "0.18.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
tokio = { version = "1.54.1", features = ["net", "time", "rt"] }
url = "2.5.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
rcgen = "0.14.10"
time = "0.3"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "time"] }
