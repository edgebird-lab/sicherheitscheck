[package]
name = "sicherheitscheck"
version = "0.1.0"
description = "Sicherheitscheck: IT-Sicherheitsberatung nach DIN SPEC 27076 für kleine Betriebe"
authors = ["Robin Olbricht"]
edition = "2024"
rust-version = "1.90"
publish = false

# Workspace: das Programm und die Crate netzpruefung (ohne Tauri, auch unter Linux testbar)
[workspace]
members = [".", "netzpruefung"]

[lib]
name = "sicherheitscheck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-single-instance = "2.5.5"
netzpruefung = { path = "netzpruefung" }

# PDF direkt aus der WebView2; die Versionen müssen zu denen passen, die Tauri selbst nutzt.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = "0.62.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
